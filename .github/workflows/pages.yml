name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site/outputs/kongregate_ranked_games
          cp index.html _site/index.html
          cp .nojekyll _site/.nojekyll
          cp outputs/kongregate_ranked_games/play_count_bar_chart_race.html _site/outputs/kongregate_ranked_games/play_count_bar_chart_race.html
          cp outputs/kongregate_ranked_games/play_count_bar_chart_race_data.json _site/outputs/kongregate_ranked_games/play_count_bar_chart_race_data.json
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
